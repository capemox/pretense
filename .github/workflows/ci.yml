name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run ruff check .
      - run: uv run mypy --python-version ${{ matrix.python-version }} src/pretense
      - run: uv run pytest --cov=pretense
      - run: uv run torchrun --standalone --nproc-per-node=2 tests/distributed/cocondenser_smoke.py
      - run: uv build --no-sources
      - run: uv run twine check dist/*
      - name: Smoke-test the installed wheel API
        run: >-
          uv run --refresh --with dist/*.whl --no-project python -c
          "from pretense import PretenseTrainer, PretenseTrainingArguments, MNRLCollator,
          SimCSECollator, SimCSEForPretraining, ContrastiveLoss,
          MultipleNegativesRankingLoss, CachedMultipleNegativesRankingLoss"

  dependency-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv venv .venv-floor
      - run: >-
          uv pip install --python .venv-floor/bin/python
          --constraint tests/constraints/lowest.txt --editable ".[dev]"
      - run: .venv-floor/bin/python -m pytest
      - run: >-
          .venv-floor/bin/torchrun --standalone --nproc-per-node=2
          tests/distributed/cocondenser_smoke.py
