# Supervised sentence-pair contrastive training compatible with Sentence Transformers.
model:
  model_name_or_path: google-bert/bert-base-uncased
method:
  name: contrastive
  contrastive_distance_metric: cosine
  contrastive_margin: 0.5
data:
  data_files: data/pairs.jsonl
  split: train
  text_column: sentence1
  text_pair_column: sentence2
  label_column: label
  max_seq_length: 256
training:
  output_dir: outputs/contrastive
  per_device_train_batch_size: 64
  learning_rate: 2.0e-5
  num_train_epochs: 1
  logging_steps: 50
  save_strategy: steps
  save_steps: 500
  save_total_limit: 2
  bf16: true
