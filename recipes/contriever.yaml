# Paper-scale English Contriever pretraining. Reduce max_steps and queue_size for a smoke run.
model:
  model_name_or_path: google-bert/bert-base-uncased
method:
  name: contriever
  contrastive_temperature: 0.05
  momentum: 0.9995
  queue_size: 131072
  augmentation: delete
  augmentation_probability: 0.10
  crop_ratio_min: 0.10
  crop_ratio_max: 0.50
  normalize_embeddings: false
data:
  data_files: data/documents.jsonl
  split: train
  text_column: text
  max_seq_length: 256
training:
  output_dir: outputs/contriever
  per_device_train_batch_size: 64
  learning_rate: 5.0e-5
  weight_decay: 0.01
  max_steps: 500000
  warmup_ratio: 0.04
  save_strategy: steps
  save_steps: 50000
  bf16: true
